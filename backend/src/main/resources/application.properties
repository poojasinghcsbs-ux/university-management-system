spring.application.name=university-portal-backend
spring.config.import=optional:file:./application-local.properties
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/university_management_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:replace-this-development-secret-with-a-strong-random-value-before-deployment-2026}
app.jwt.expiration-hours=24
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}
